<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Outfit!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb3d9 25%, #c9a0dc 50%, #a8d8ea 75%, #ffd1dc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #ff69b4;
        }

        h1 {
            font-size: 3em;
            color: #ff1493;
            text-shadow: 3px 3px 0px #fff, 6px 6px 0px rgba(255, 105, 180, 0.5);
            letter-spacing: 2px;
        }

        .outfit-builder {
            flex: 1;
            margin: 20px;
            background: rgba(255, 255, 255, 0.5);
            border: 4px dashed #ff69b4;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        }

        .outfit-builder.dragover {
            background: rgba(255, 182, 193, 0.6);
            border-color: #ff1493;
        }

        .empty-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            color: #ff69b4;
            text-align: center;
            pointer-events: none;
            opacity: 0.6;
        }

        .placed-item {
            position: absolute;
            cursor: move;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
            border: 2px dashed transparent;
            min-width: 50px;
            min-height: 50px;
        }

        .placed-item:hover {
            border-color: #ff69b4;
            z-index: 100;
        }

        .placed-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .remove-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            background: #ff1493;
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            z-index: 20;
        }

        .placed-item:hover .remove-btn {
            display: flex;
        }

        .remove-btn:hover {
            background: #ff69b4;
            transform: scale(1.1);
        }

        .resize-handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff69b4;
            border: 2px solid white;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .placed-item:hover .resize-handle {
            opacity: 1;
        }

        .resize-handle.bottom-right {
            bottom: -10px;
            right: -10px;
            cursor: nwse-resize;
        }

        .resize-handle.bottom-left {
            bottom: -10px;
            left: -10px;
            cursor: nesw-resize;
        }

        .resize-handle.top-right {
            top: -10px;
            right: -10px;
            cursor: nesw-resize;
        }

        .resize-handle.top-left {
            top: -10px;
            left: -10px;
            cursor: nwse-resize;
        }

        .wardrobe-section {
            background: rgba(255, 255, 255, 0.6);
            border-top: 4px solid #ff69b4;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 0;
            overflow-x: auto;
            overflow-y: hidden;
            height: 180px;
            box-shadow: 0 -5px 20px rgba(255, 105, 180, 0.3);
        }

        .wardrobe-section::-webkit-scrollbar {
            height: 10px;
        }

        .wardrobe-section::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.3);
            border-radius: 10px;
        }

        .wardrobe-section::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 10px;
        }

        .wardrobe-items-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .wardrobe-item {
            min-width: 120px;
            height: 140px;
            background: white;
            border: 3px solid #ffb3d9;
            border-radius: 15px;
            padding: 10px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
            position: relative;
        }

        .wardrobe-item:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
            border-color: #ff69b4;
        }

        .wardrobe-item:active {
            cursor: grabbing;
        }

        .wardrobe-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .wardrobe-remove-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 28px;
            height: 28px;
            background: #ff1493;
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            font-size: 16px;
            z-index: 10;
        }

        .wardrobe-item:hover .wardrobe-remove-btn {
            display: flex;
        }

        .wardrobe-remove-btn:hover {
            background: #c71585;
            transform: scale(1.15);
        }

        .upload-btn {
            min-width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: 3px solid white;
            border-radius: 15px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            position: sticky;
            left: 0;
            flex-shrink: 0;
            z-index: 10;
            margin-right: 15px;
        }

        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.5);
        }

        .upload-btn::before {
            content: '📸';
            font-size: 2em;
        }

        input[type="file"] {
            display: none;
        }

        .clear-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff69b4;
            color: white;
            border: 3px solid white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        .save-btn {
            background: #c9a0dc;
            color: white;
            border: 3px solid white;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            box-shadow: 0 5px 15px rgba(201, 160, 220, 0.3);
            transition: all 0.2s;
        }

        .save-btn:hover {
            background: #b088c9;
            transform: scale(1.05);
        }

        .view-saved-btn {
            background: #a8d8ea;
            color: white;
            border: 3px solid white;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            box-shadow: 0 5px 15px rgba(168, 216, 234, 0.3);
            transition: all 0.2s;
        }

        .view-saved-btn:hover {
            background: #8bc9de;
            transform: scale(1.05);
        }

        .buttons-section {
            background: transparent;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin: 0 20px;
        }

        .save-confirmation {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #c9a0dc, #a8d8ea);
            color: white;
            border: 3px solid white;
            padding: 15px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 5px 20px rgba(201, 160, 220, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 100;
        }

        .save-confirmation.show {
            opacity: 1;
            transform: translateY(0);
        }

        .saved-outfits-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb3d9 25%, #c9a0dc 50%, #a8d8ea 75%, #ffd1dc 100%);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .saved-outfits-screen.active {
            display: block;
        }

        .saved-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .saved-header h2 {
            font-size: 2.5em;
            color: #ff1493;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(255, 105, 180, 0.5);
            margin-bottom: 20px;
        }

        .back-btn {
            background: #ff69b4;
            color: white;
            border: 3px solid white;
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        .saved-outfits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .saved-outfit-card {
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid #ff69b4;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.3);
            position: relative;
        }

        .saved-outfit-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .saved-outfit-date {
            text-align: center;
            color: #ff1493;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .delete-saved-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 35px;
            height: 35px;
            background: #ff1493;
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            font-size: 1.2em;
        }

        .delete-saved-btn:hover {
            background: #c71585;
            transform: scale(1.1);
        }

        .no-outfits {
            text-align: center;
            color: #ff1493;
            font-size: 1.5em;
            margin-top: 50px;
            grid-column: 1 / -1;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Build Your Outfit! ✨</h1>
    </div>

    <div class="outfit-builder" id="outfitBuilder">
        <button class="clear-btn" id="clearBtn">Clear All</button>
        <div class="empty-message" id="emptyMessage">
            Drag clothing items here to create your outfit! 👗👕👠
        </div>
        <div class="save-confirmation" id="saveConfirmation">Outfit Saved! ✨</div>
    </div>

    <div class="buttons-section">
        <button class="save-btn" id="saveBtn">💾 Save Outfit</button>
        <button class="view-saved-btn" id="viewSavedBtn">👗 View Saved Outfits</button>
    </div>

    <div class="saved-outfits-screen" id="savedOutfitsScreen">
        <div class="saved-header">
            <h2>Saved Outfits 💖</h2>
            <button class="back-btn" id="backBtn">← Back to Builder</button>
        </div>
        <div class="saved-outfits-grid" id="savedOutfitsGrid">
            <div class="no-outfits" id="noOutfits">No saved outfits yet! Create and save your first outfit! ✨</div>
        </div>
    </div>

    <div class="wardrobe-section" id="wardrobeSection">
        <label for="fileInput" class="upload-btn">
            Upload Photo
        </label>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="wardrobe-items-container" id="wardrobeItems">
            <div class="wardrobe-item" draggable="true" data-item="tshirt">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ff6b9d' d='M30 20 L20 30 L20 50 L25 50 L25 90 L75 90 L75 50 L80 50 L80 30 L70 20 L65 25 Q50 20 35 25 Z'/%3E%3C/svg%3E" alt="T-Shirt">
                <div class="wardrobe-remove-btn">×</div>
            </div>
            <div class="wardrobe-item" draggable="true" data-item="jeans">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%235B9BD5' d='M30 20 L30 60 L25 95 L40 95 L45 60 L45 20 Z M55 20 L55 60 L60 95 L75 95 L70 60 L70 20 Z'/%3E%3C/svg%3E" alt="Jeans">
                <div class="wardrobe-remove-btn">×</div>
            </div>
            <div class="wardrobe-item" draggable="true" data-item="dress">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ff9ec7' d='M35 15 L30 25 L25 35 L25 45 Q25 50 30 55 L20 95 L80 95 L70 55 Q75 50 75 45 L75 35 L70 25 L65 15 Q50 20 35 15 Z'/%3E%3C/svg%3E" alt="Dress">
                <div class="wardrobe-remove-btn">×</div>
            </div>
            <div class="wardrobe-item" draggable="true" data-item="jacket">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23a8d8ea' d='M32 20 L25 28 L22 85 L30 85 L30 45 L35 40 L35 85 L45 85 L45 35 L50 30 L55 35 L55 85 L65 85 L65 40 L70 45 L70 85 L78 85 L75 28 L68 20 Q50 15 32 20 Z'/%3E%3C/svg%3E" alt="Jacket">
                <div class="wardrobe-remove-btn">×</div>
            </div>
            <div class="wardrobe-item" draggable="true" data-item="shoes">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse fill='%23ffb3d9' cx='35' cy='60' rx='15' ry='8'/%3E%3Cpath fill='%23ffb3d9' d='M20 60 L20 55 Q20 45 30 45 L40 45 Q50 45 50 55 L50 60 Z'/%3E%3Cellipse fill='%23ffb3d9' cx='65' cy='60' rx='15' ry='8'/%3E%3Cpath fill='%23ffb3d9' d='M50 60 L50 55 Q50 45 60 45 L70 45 Q80 45 80 55 L80 60 Z'/%3E%3C/svg%3E" alt="Shoes">
                <div class="wardrobe-remove-btn">×</div>
            </div>
            <div class="wardrobe-item" draggable="true" data-item="hat">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse fill='%23c9a0dc' cx='50' cy='65' rx='35' ry='8'/%3E%3Cpath fill='%23c9a0dc' d='M30 65 Q30 30 50 25 Q70 30 70 65 Z'/%3E%3C/svg%3E" alt="Hat">
                <div class="wardrobe-remove-btn">×</div>
            </div>
        </div>
    </div>

    <script>
        const outfitBuilder = document.getElementById('outfitBuilder');
        const wardrobeSection = document.getElementById('wardrobeSection');
        const wardrobeItems = document.getElementById('wardrobeItems');
        const fileInput = document.getElementById('fileInput');
        const emptyMessage = document.getElementById('emptyMessage');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const viewSavedBtn = document.getElementById('viewSavedBtn');
        const savedOutfitsScreen = document.getElementById('savedOutfitsScreen');
        const backBtn = document.getElementById('backBtn');
        const savedOutfitsGrid = document.getElementById('savedOutfitsGrid');
        const noOutfits = document.getElementById('noOutfits');
        const saveConfirmation = document.getElementById('saveConfirmation');
        
        let draggedElement = null;
        let placedItems = [];
        let itemCounter = 0;
        let savedOutfits = [];

        // Drag from wardrobe
        document.addEventListener('dragstart', (e) => {
            if (e.target.classList.contains('wardrobe-item')) {
                draggedElement = e.target;
                e.dataTransfer.effectAllowed = 'copy';
                e.dataTransfer.setData('text/html', e.target.innerHTML);
            }
        });

        document.addEventListener('dragend', (e) => {
            if (e.target.classList.contains('wardrobe-item')) {
                draggedElement = null;
            }
        });

        outfitBuilder.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            outfitBuilder.classList.add('dragover');
        });

        outfitBuilder.addEventListener('dragleave', (e) => {
            if (e.target === outfitBuilder) {
                outfitBuilder.classList.remove('dragover');
            }
        });

        outfitBuilder.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            outfitBuilder.classList.remove('dragover');
            
            const content = e.dataTransfer.getData('text/html');
            if (content) {
                const rect = outfitBuilder.getBoundingClientRect();
                const x = e.clientX - rect.left - 60;
                const y = e.clientY - rect.top - 60;
                
                createPlacedItem(content, x, y);
                updateEmptyMessage();
            }
        });

        function createPlacedItem(content, x, y) {
            const item = document.createElement('div');
            item.className = 'placed-item';
            item.style.left = x + 'px';
            item.style.top = y + 'px';
            item.style.width = '120px';
            item.style.height = '120px';
            item.innerHTML = content;
            
            const removeBtn = document.createElement('div');
            removeBtn.className = 'remove-btn';
            removeBtn.innerHTML = '×';
            removeBtn.onclick = () => {
                item.remove();
                placedItems = placedItems.filter(i => i !== item);
                updateEmptyMessage();
            };
            item.appendChild(removeBtn);
            
            // Add resize handles
            const handles = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
            handles.forEach(position => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${position}`;
                item.appendChild(handle);
                
                handle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    initResize(e, item, position);
                });
            });
            
            let isDragging = false;
            let currentX, currentY, initialX, initialY;
            
            item.addEventListener('mousedown', (e) => {
                if (e.target === removeBtn || e.target.classList.contains('resize-handle')) return;
                isDragging = true;
                initialX = e.clientX - item.offsetLeft;
                initialY = e.clientY - item.offsetTop;
                item.style.zIndex = 1000;
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                item.style.left = currentX + 'px';
                item.style.top = currentY + 'px';
            });
            
            document.addEventListener('mouseup', () => {
                isDragging = false;
                item.style.zIndex = '';
            });
            
            outfitBuilder.appendChild(item);
            placedItems.push(item);
        }

        function initResize(e, item, position) {
            e.preventDefault();
            const startX = e.clientX;
            const startY = e.clientY;
            const startWidth = item.offsetWidth;
            const startHeight = item.offsetHeight;
            const startLeft = item.offsetLeft;
            const startTop = item.offsetTop;
            const aspectRatio = startWidth / startHeight;
            
            function resize(e) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                let newWidth = startWidth;
                let newHeight = startHeight;
                let newLeft = startLeft;
                let newTop = startTop;
                
                if (position === 'bottom-right') {
                    newWidth = Math.max(50, startWidth + deltaX);
                    newHeight = newWidth / aspectRatio;
                } else if (position === 'bottom-left') {
                    newWidth = Math.max(50, startWidth - deltaX);
                    newHeight = newWidth / aspectRatio;
                    newLeft = startLeft + (startWidth - newWidth);
                } else if (position === 'top-right') {
                    newWidth = Math.max(50, startWidth + deltaX);
                    newHeight = newWidth / aspectRatio;
                    newTop = startTop + (startHeight - newHeight);
                } else if (position === 'top-left') {
                    newWidth = Math.max(50, startWidth - deltaX);
                    newHeight = newWidth / aspectRatio;
                    newLeft = startLeft + (startWidth - newWidth);
                    newTop = startTop + (startHeight - newHeight);
                }
                
                item.style.width = newWidth + 'px';
                item.style.height = newHeight + 'px';
                item.style.left = newLeft + 'px';
                item.style.top = newTop + 'px';
            }
            
            function stopResize() {
                document.removeEventListener('mousemove', resize);
                document.removeEventListener('mouseup', stopResize);
            }
            
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);
        }

        // File upload
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const wardrobeItem = document.createElement('div');
                    wardrobeItem.className = 'wardrobe-item';
                    wardrobeItem.draggable = true;
                    wardrobeItem.innerHTML = `<img src="${event.target.result}" alt="Custom item"><div class="wardrobe-remove-btn">×</div>`;
                    wardrobeItems.appendChild(wardrobeItem);
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = '';
        });

        // Remove from wardrobe
        wardrobeSection.addEventListener('click', (e) => {
            if (e.target.classList.contains('wardrobe-remove-btn')) {
                e.stopPropagation();
                const item = e.target.closest('.wardrobe-item');
                if (item) {
                    item.remove();
                }
            }
        });

        // Clear all
        clearBtn.addEventListener('click', () => {
            placedItems.forEach(item => item.remove());
            placedItems = [];
            updateEmptyMessage();
        });

        // Save outfit
        saveBtn.addEventListener('click', () => {
            if (placedItems.length === 0) {
                alert('Add some clothing items to your outfit first! 👗');
                return;
            }

            // Temporarily hide buttons and empty message for screenshot
            clearBtn.style.display = 'none';
            emptyMessage.style.display = 'none';
            
            // Hide all control buttons on placed items
            const allRemoveBtns = outfitBuilder.querySelectorAll('.remove-btn');
            const allResizeHandles = outfitBuilder.querySelectorAll('.resize-handle');
            allRemoveBtns.forEach(btn => btn.style.display = 'none');
            allResizeHandles.forEach(handle => handle.style.display = 'none');

            // Take screenshot using html2canvas equivalent approach
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const rect = outfitBuilder.getBoundingClientRect();
            
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Draw background
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 182, 193, 0.3)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw each placed item
            let imagesLoaded = 0;
            const totalImages = placedItems.length;
            
            if (totalImages === 0) {
                finishSave(canvas);
                return;
            }
            
            placedItems.forEach(item => {
                const img = item.querySelector('img');
                const itemRect = item.getBoundingClientRect();
                const builderRect = outfitBuilder.getBoundingClientRect();
                
                const x = itemRect.left - builderRect.left;
                const y = itemRect.top - builderRect.top;
                
                const tempImg = new Image();
                tempImg.crossOrigin = 'anonymous';
                tempImg.onload = () => {
                    ctx.drawImage(tempImg, x, y, itemRect.width, itemRect.height);
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        finishSave(canvas);
                    }
                };
                tempImg.onerror = () => {
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        finishSave(canvas);
                    }
                };
                tempImg.src = img.src;
            });
        });
        
        function finishSave(canvas) {
            const imageData = canvas.toDataURL('image/png');
            const timestamp = new Date().toLocaleString();
            
            savedOutfits.push({
                image: imageData,
                date: timestamp,
                id: Date.now()
            });
            
            // Restore buttons
            clearBtn.style.display = '';
            updateEmptyMessage();
            
            // Show confirmation message
            saveConfirmation.classList.add('show');
            setTimeout(() => {
                saveConfirmation.classList.remove('show');
            }, 3000);
        }

        // View saved outfits
        viewSavedBtn.addEventListener('click', () => {
            savedOutfitsScreen.classList.add('active');
            displaySavedOutfits();
        });

        backBtn.addEventListener('click', () => {
            savedOutfitsScreen.classList.remove('active');
        });

        function displaySavedOutfits() {
            savedOutfitsGrid.innerHTML = '';
            
            if (savedOutfits.length === 0) {
                savedOutfitsGrid.innerHTML = '<div class="no-outfits">No saved outfits yet! Create and save your first outfit! ✨</div>';
                return;
            }
            
            savedOutfits.forEach(outfit => {
                const card = document.createElement('div');
                card.className = 'saved-outfit-card';
                card.innerHTML = `
                    <div class="delete-saved-btn" data-id="${outfit.id}">×</div>
                    <img src="${outfit.image}" alt="Saved Outfit">
                    <div class="saved-outfit-date">${outfit.date}</div>
                `;
                savedOutfitsGrid.appendChild(card);
            });
        }

        // Delete saved outfit
        savedOutfitsGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-saved-btn')) {
                const id = parseInt(e.target.getAttribute('data-id'));
                savedOutfits = savedOutfits.filter(outfit => outfit.id !== id);
                displaySavedOutfits();
            }
        });

        function updateEmptyMessage() {
            emptyMessage.style.display = placedItems.length === 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
